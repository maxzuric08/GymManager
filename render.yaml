services:
  - type: web
    name: gymmanager-api
    runtime: docker
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    initialDeployHook: npm run db:seed-demo
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gymmanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: DEMO_ADMIN_USERNAME
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_USER_USERNAME
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: DEMO_USER_EMAIL
        sync: false
      - key: DEMO_USER_DNI
        sync: false
      - key: DEMO_MEMBER_USERNAME
        sync: false
      - key: DEMO_MEMBER_PASSWORD
        sync: false
      - key: DEMO_MEMBER_EMAIL
        sync: false
      - key: DEMO_MEMBER_DNI
        sync: false

  - type: web
    name: gymmanager-frontend
    runtime: static
    branch: dev
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: gymmanager-db
    databaseName: gymmanager
    user: gymmanager
